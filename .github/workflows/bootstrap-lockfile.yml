name: Bootstrap npm lockfile

on:
  push:
    branches:
      - feature/game-number

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/game-number

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Use current npm
        run: npm install --global npm@12.1.0

      - name: Generate lockfile from package manifest
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --package-lock-only

      - name: Commit lockfile if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh npm lockfile for GameNumber"
          git push origin HEAD:feature/game-number
