name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Temporary formatter diagnostic
        run: |
          npx prettier --write \
            src/app/foundation.test.ts \
            src/core/simulation/greybox-loop.test.ts \
            src/core/simulation/greybox-loop.ts \
            src/game/scenes/foundation-scene.ts \
            src/main.ts \
            src/styles.css \
            tests/e2e/foundation.spec.ts
          git rev-parse 'HEAD^{tree}'
          for file in \
            src/app/foundation.test.ts \
            src/core/simulation/greybox-loop.test.ts \
            src/core/simulation/greybox-loop.ts \
            src/game/scenes/foundation-scene.ts \
            src/main.ts \
            src/styles.css \
            tests/e2e/foundation.spec.ts
          do
            printf 'FORMAT-BEGIN:%s\n' "$file"
            base64 -w0 "$file"
            printf '\nFORMAT-END:%s\n' "$file"
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload playable greybox build
        uses: actions/upload-artifact@v7
        with:
          name: project-scale-greybox
          path: dist/
          retention-days: 14
          if-no-files-found: error
          overwrite: true
